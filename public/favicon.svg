<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark background tile -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- git branch fork shape -->

  <!-- main branch: bottom node -->
  <circle cx="11" cy="23" r="2.5" fill="#6366f1"/>
  <!-- main branch: vertical stem -->
  <line x1="11" y1="20.5" x2="11" y2="12" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>
  <!-- main branch: top node -->
  <circle cx="11" cy="9.5" r="2.5" fill="#6366f1"/>

  <!-- feature branch: curved arm off the stem -->
  <path d="M11 17.5 C11 13.5 21 13.5 21 9.5" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- feature branch: top node -->
  <circle cx="21" cy="9.5" r="2.5" fill="#34d399"/>
</svg>
